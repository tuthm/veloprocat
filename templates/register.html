{% extends "base.html" %}
{% block title %}Регистрация — Велопрокат{% endblock %}
{% block content %}
<section class="section">
  <div class="container auth-card card">
    <h1>Регистрация</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <p class="form-row">
          {{ field.label_tag }} {{ field }}
          {% for e in field.errors %}<span class="error">{{ e }}</span>{% endfor %}
        </p>
      {% endfor %}
      <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
    </form>
  </div>
</section>
{% endblock %}
